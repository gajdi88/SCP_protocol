name: Firmware

# Runs the host test suite (test/run.sh) and compiles scp_bench for both
# supported boards, so a firmware change is known to behave and to build before
# anyone flashes it. Nothing is uploaded or published.
on:
  push:
    branches: [main]
    paths: ['scp_bench/**', 'amp_sim/**', 'app/**', 'test/**', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['scp_bench/**', 'amp_sim/**', 'app/**', 'test/**', '.github/workflows/firmware.yml']
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run test/run.sh
        run: ./test/run.sh

  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fqbn:
          - esp32:esp32:esp32:PartitionScheme=huge_app
          - esp32:esp32:esp32h2:PartitionScheme=huge_app,CDCOnBoot=cdc
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install the ESP32 core
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Compile
        run: arduino-cli compile --fqbn "${{ matrix.fqbn }}" --warnings default scp_bench
