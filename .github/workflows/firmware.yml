name: Firmware

# Compiles scp_bench for both supported boards, so a firmware change is known to
# build before anyone flashes it. Nothing is uploaded or published.
on:
  push:
    branches: [main]
    paths: ['scp_bench/**', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['scp_bench/**', '.github/workflows/firmware.yml']
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fqbn:
          - esp32:esp32:esp32:PartitionScheme=huge_app
          - esp32:esp32:esp32h2:PartitionScheme=huge_app,CDCOnBoot=cdc
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          sketch-paths: |
            - scp_bench
          enable-deltas-report: false
