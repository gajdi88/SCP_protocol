name: Android APK

# Builds the native remote and, on main, publishes it as a GitHub release so the
# phone can always fetch the newest one from
#   https://github.com/gajdi88/SCP_protocol/releases/latest/download/scp-remote.apk
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The signing key must stay the same from build to build, or the phone
      # refuses to install an update over the previous version. It is not in the
      # repo (the repo is public). A SCP_KEYSTORE_B64 secret wins if one is set;
      # otherwise the first main build makes a key and the Actions cache keeps
      # it. Pull requests get a throwaway key and never touch the cached one.
      - name: Restore signing key
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: android/scp-remote.keystore
          key: scp-signing-key-v1

      - name: Signing key
        env:
          KEY_B64: ${{ secrets.SCP_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > android/scp-remote.keystore
          elif [ ! -f android/scp-remote.keystore ]; then
            keytool -genkeypair -keystore android/scp-remote.keystore -storetype PKCS12 \
              -alias scp -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass scpremote -keypass scpremote -dname "CN=SCP Remote"
          fi

      - name: Build
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk scp-remote.apk

      - uses: actions/upload-artifact@v4
        with:
          name: scp-remote-1.0.${{ github.run_number }}
          path: scp-remote.apk

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "remote-v1.0.${{ github.run_number }}" scp-remote.apk \
            --target "${{ github.sha }}" \
            --title "SCP Remote 1.0.${{ github.run_number }}" \
            --notes "Android remote for the MATCH UP 8DSP. Install scp-remote.apk on the phone." \
            --latest
