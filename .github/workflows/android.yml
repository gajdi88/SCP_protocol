name: Android APK

# Builds the native remote and, on main, publishes it as a GitHub release so the
# phone can always fetch the newest one from
#   https://github.com/gajdi88/SCP_protocol/releases/latest/download/scp-remote.apk
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk scp-remote.apk

      - uses: actions/upload-artifact@v4
        with:
          name: scp-remote-1.0.${{ github.run_number }}
          path: scp-remote.apk

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "remote-v1.0.${{ github.run_number }}" scp-remote.apk \
            --target "${{ github.sha }}" \
            --title "SCP Remote 1.0.${{ github.run_number }}" \
            --notes "Android remote for the MATCH UP 8DSP. Install scp-remote.apk on the phone." \
            --latest
